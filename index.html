<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omnitrix System Core</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-biomnitrix">
  <div class="app-container">
    
    <!-- CỘT TRÁI: SIDEBAR -->
    <aside class="sidebar" id="leftSidebar">
      <div class="brand">
        <!-- SVG sẽ được JS cập nhật hoặc giữ mặc định ở đây -->
        <div class="brand-icon" id="brandIconWrap">
          <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </div>
        <div class="brand-text">
          <h1 id="brandTitle">BIOMNITRIX</h1>
          <p id="brandSubtitle">USER_ID // Ben Tennyson</p>
        </div>
      </div>

      <nav class="tabs">
        <button class="tab tab-active" data-tab="biomnitrix">Lõi Biomnitrix (Dung Hợp)</button>
        <button class="tab" data-tab="ultimatrix">Lõi Ultimatrix (Tiến Hóa)</button>
        <button class="tab" data-tab="chaquetrix">Lõi Chaquetrix (Triệu Hồi)</button>
      </nav>

      <div class="sidebar-footer">
        <button id="btnCollection" class="btn-outline">Bộ Sưu Tập Alien</button>
        <button id="btnArena" class="btn-outline">Đấu Trường</button>
      </div>
    </aside>

    <!-- CỘT PHẢI: BẢNG ĐIỀU KHIỂN CHÍNH -->
    <main class="main-panel" id="rightPanel">
      <header class="top-bar">
        <div class="radar-core">
          <div class="radar-core-icon" id="radarCoreIcon">
            <!-- Icon đồng bộ với brandIconWrap -->
            <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 17 12 22 22 17"></polyline>
              <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
          </div>
        </div>
        <button id="btnCycleCore" class="btn-icon" title="Chuyển đổi Lõi nhanh">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        </button>
      </header>

      <div class="controls-row">
        <div class="slot-stepper" id="slotStepper">
          <button id="btnSlotMinus" class="stepper-btn">&minus;</button>
          <div class="stepper-display">
            <span id="slotCountDisplay">2</span> SLOT
          </div>
          <button id="btnSlotPlus" class="stepper-btn">&plus;</button>
        </div>
        <button id="btnDice" class="btn-dice">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"></circle><circle cx="15.5" cy="15.5" r="1.5" fill="currentColor"></circle></svg>
          Random Gen
        </button>
      </div>

      <div class="dna-grid" id="dnaGrid">
        <!-- JS render HTML các khe cắm DNA vào đây -->
      </div>

      <div id="subpanelContainer" class="subpanel-container">
        <!-- JS render UI Tùy chỉnh của Ultimatrix / Chaquetrix vào đây -->
      </div>

      <div class="action-section">
        <button id="btnProcess" class="btn-process">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          <span id="btnProcessText">DUNG HỢP ADN</span>
        </button>
      </div>

      <div id="fusionResult" class="fusion-result" hidden>
        <!-- JS render Kết quả vào đây -->
      </div>
    </main>

    <!-- ĐIỀU HƯỚNG MOBILE -->
    <nav class="mobile-nav">
      <button id="navBtnControl" class="mobile-nav-btn active">Điều Khiển</button>
      <button id="navBtnResult" class="mobile-nav-btn">Hệ Thống</button>
    </nav>

  </div>

  <!-- MODAL DANH SÁCH ALIEN -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">NẠP MÃ GEN</h2>
        <button id="btnModalClose" class="btn-close">&times;</button>
      </div>
      <div class="modal-grid" id="modalGrid">
        <!-- JS render danh sách Alien vào đây -->
      </div>
    </div>
  </div>

  <!-- THÔNG BÁO (TOAST) -->
  <div class="toast" id="toast" hidden></div>

  <script src="script.js"></script>
</body>
</html>
