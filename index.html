<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lõi Omnitrix</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app" class="app-shell">

    <!-- ========================= CỘT TRÁI: SIDEBAR ========================= -->
    <aside class="sidebar">

      <!-- Header: Logo + Action buttons -->
      <header class="sidebar-header">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">
            <!-- Icon CPU dạng inline SVG (thay cho cpu.png để không bị lỗi 404),
                 tô màu bằng currentColor nên vẫn đổi màu neon như yêu cầu -->
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6">
              <rect x="6" y="6" width="12" height="12" rx="1.5"/>
              <rect x="9" y="9" width="6" height="6" rx="0.5"/>
              <path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>
            </svg>
          </span>
          <div class="brand-text">
            <h1 class="brand-title">LÕI OMNITRIX</h1>
            <p class="brand-subtitle">USER_ID // TENNYSON</p>
          </div>
        </div>

        <div class="header-actions">
          <button type="button" class="btn btn-outline" id="btnArena">ĐẤU TRƯỜNG</button>
          <button type="button" class="btn btn-outline" id="btnCollection">BỘ SƯU TẬP</button>
        </div>
      </header>

      <!-- Tabs -->
      <nav class="tabs" role="tablist" aria-label="Chế độ dung hợp">
        <button type="button" class="tab" role="tab" data-tab="ultimate">ULTIMATE</button>
        <button type="button" class="tab tab-active" role="tab" data-tab="biomnitrix" aria-selected="true">BIOMNITRIX</button>
        <button type="button" class="tab" role="tab" data-tab="chaquetrix">CHAQUETRIX</button>
      </nav>

      <!-- Module Chuỗi Gen Đa Hợp -->
      <section class="panel">
        <div class="panel-header">
          <h2 class="panel-title"><span class="panel-title-icon" aria-hidden="true">✦</span>CHUỖI GEN ĐA HỢP</h2>

          <div class="panel-controls">
            <button type="button" class="icon-btn" id="btnDice" title="Ngẫu nhiên hóa">
              <span aria-hidden="true">⚁</span>
            </button>

            <div class="stepper" id="slotStepper">
              <button type="button" class="stepper-btn" id="btnSlotMinus" aria-label="Giảm số ô">-</button>
              <span class="stepper-value" id="slotCountDisplay">2</span>
              <button type="button" class="stepper-btn" id="btnSlotPlus" aria-label="Tăng số ô">+</button>
            </div>
          </div>
        </div>

        <!-- Lưới các ô ADN được render động bởi main.js -->
        <div class="dna-grid" id="dnaGrid" aria-live="polite"></div>
      </section>

      <!-- Nút xử lý / dung hợp -->
      <button type="button" class="process-btn" id="btnProcess">ĐANG XỬ LÝ...</button>
    </aside>

    <!-- ========================= CỘT PHẢI: MAIN VIEW ========================= -->
    <main class="main-view">
      <div class="dot-grid" aria-hidden="true"></div>

      <div class="radar-wrap">
        <!-- Hệ thống nhiều vòng tròn nét đứt đồng tâm, kích thước/độ mờ khác nhau
             để tạo chiều sâu không gian: một số xoay, một số đứng yên -->
        <div class="radar-ring radar-ring--r1" aria-hidden="true"></div>
        <div class="radar-ring radar-ring--r2" aria-hidden="true"></div>
        <div class="radar-ring radar-ring--r3" aria-hidden="true"></div>
        <div class="radar-ring radar-ring--r4" aria-hidden="true"></div>

        <div class="radar-core" id="radarCore" aria-live="polite">
          <!-- Lớp 1: Quầng glow trung tâm — chạy animation pulse liên tục,
               nằm dưới cùng để tạo hào quang lan ra xung quanh khối đen -->
          <div class="radar-core-glow" aria-hidden="true"></div>

          <!-- Lớp 2: Khối tròn nền đen — khớp tuyệt đối với var(--bg),
               nằm giữa glow và icon, che phần trong của glow -->
          <div class="radar-core-base" aria-hidden="true"></div>

          <div class="radar-core-icon" aria-hidden="true">
            <!-- Icon "Layers / Stack" dạng SVG, tô màu neon qua currentColor -->
            <svg viewBox="0 0 24 24" width="88" height="88" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 17 12 22 22 17"></polyline>
              <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
          </div>

          <div class="radar-core-status">CHỜ KHỞI ĐỘNG</div>
        </div>
      </div>

      <div class="fusion-result" id="fusionResult" hidden></div>
    </main>
  </div>

  <!-- ========================= MODAL: KHO ALIEN (inventory / collection) ========================= -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h3 id="modalTitle">NẠP MÃ GEN</h3>
        <button type="button" class="modal-close" id="btnModalClose" aria-label="Đóng">✕</button>
      </div>
      <div class="modal-grid" id="modalGrid"></div>
    </div>
  </div>

  <!-- Toast thông báo -->
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
