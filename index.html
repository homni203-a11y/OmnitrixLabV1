<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lõi Omnitrix - Hệ Thống Nâng Cấp</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="theme-biomnitrix">
  <!-- ========================= GLOBAL BACKGROUND ========================= -->
  <div class="global-bg" aria-hidden="true">
    <div class="global-grid"></div>
    <div class="global-radar">
      <div class="g-ring g-ring-outer"></div>
      <div class="g-ring g-ring-inner"></div>
    </div>
  </div>

  <div id="app" class="app-shell">

    <!-- ========================= CỘT TRÁI: KHUNG ĐIỀU KHIỂN ========================= -->
    <aside class="sidebar">
      <header class="sidebar-header">
        <div class="brand">
          <!-- Viền tròn ôm trọn icon lõi (Đã fix lỗi méo) -->
          <div class="brand-icon-wrap">
            <span class="brand-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6">
                <rect x="6" y="6" width="12" height="12" rx="1.5"/>
                <rect x="9" y="9" width="6" height="6" rx="0.5"/>
                <path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>
              </svg>
            </span>
          </div>
          <div class="brand-text">
            <h1 class="brand-title">
              LÕI OMNITRIX 
              <span class="badge-team">TỔ 3</span>
            </h1>
            <p class="brand-subtitle">USER_ID // TENNYSON</p>
          </div>
        </div>
      </header>

      <!-- Tabs với SVG Icon -->
      <nav class="tabs" role="tablist">
        <button type="button" class="tab" role="tab" data-tab="ultimate">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
          ULTIMATE
        </button>
        <button type="button" class="tab tab-active" role="tab" data-tab="biomnitrix">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
          BIOMNITRIX
        </button>
        <button type="button" class="tab" role="tab" data-tab="chaquetrix">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
          CHAQUETRIX
        </button>
      </nav>

      <section class="panel">
        <div class="panel-header">
          <h2 class="panel-title"><span class="panel-title-icon" aria-hidden="true">✦</span>CHUỖI GEN ĐA HỢP</h2>
          <div class="panel-controls">
            <button type="button" class="icon-btn" id="btnDice" title="Ngẫu nhiên hóa">⚁</button>
            <div class="stepper" id="slotStepper">
              <button type="button" class="stepper-btn" id="btnSlotMinus">-</button>
              <span class="stepper-value" id="slotCountDisplay">2</span>
              <button type="button" class="stepper-btn" id="btnSlotPlus">+</button>
            </div>
          </div>
        </div>
        <div class="dna-grid" id="dnaGrid"></div>
      </section>

      <button type="button" class="process-btn" id="btnProcess">DUNG HỢP ADN</button>
    </aside>

    <!-- ========================= CỘT PHẢI: KHUNG ĐỘC LẬP ========================= -->
    <main class="main-view" id="rightPanel">

      <!-- ========================= 4 NÚT TÍNH NĂNG GÓC TRÊN PHẢI ========================= -->
      <div class="top-right-actions">
        <!-- Nút 1: Cài đặt (Bánh răng) -->
        <button type="button" class="btn-action" aria-label="Cài đặt">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>

        <!-- Nút 2: Đấu trường -->
        <button type="button" class="btn-action" id="btnArena">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 17.5L3 6V3h3l11.5 11.5"></path>
            <path d="M13 19l6-6"></path>
            <path d="M16 16l4 4"></path>
            <path d="M19 21l2-2"></path>
            <path d="M9.5 6.5L21 18v3h-3L6.5 9.5"></path>
            <path d="M5 11l-2 2"></path>
            <path d="M8 8l-4 4"></path>
            <path d="M3 21l2-2"></path>
          </svg>
          ĐẤU TRƯỜNG
        </button>

        <!-- Nút 3: Bộ sưu tập -->
        <button type="button" class="btn-action" id="btnCollection">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
          BỘ SƯU TẬP
        </button>

        <!-- Nút 4: Đổi lõi vũ trụ -->
        <button type="button" class="btn-action">
          <svg class="icon-refresh" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--theme-base)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
