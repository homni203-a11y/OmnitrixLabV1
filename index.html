<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lõi Omnitrix - Hệ Thống Nâng Cấp Cao Cấp</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="theme-biomnitrix">
  <!-- GLOBAL BACKGROUND -->
  <div class="global-bg" aria-hidden="true">
    <div class="global-grid"></div>
    <div class="global-radar">
      <div class="g-ring g-ring-outer"></div>
      <div class="g-ring g-ring-inner"></div>
    </div>
  </div>

  <div id="app" class="app-shell">
    <!-- APP HEADER -->
    <header class="app-header">
      <div class="brand" id="brandContainer">
        <div class="brand-icon-wrap" id="brandIconWrap">
          <!-- Trạng thái mặc định -->
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="brand-title" id="brandTitle">BIOMNITRIX</h1>
          <p class="brand-subtitle" id="brandSubtitle">USER_ID // Ben Tennyson</p>
        </div>
      </div>

      <!-- TOP RIGHT ACTIONS -->
      <div class="top-right-actions">
        <!-- Nút Cài đặt (Mở Google Login) -->
        <button type="button" class="btn-action btn-icon-only" id="btnSettings" title="Cài đặt hệ thống">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <button type="button" class="btn-action" id="btnCycleCore" title="Đổi Lõi Vũ Trụ">
          <svg class="icon-colored" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2v6h-6"></path>
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
            <path d="M3 22v-6h6"></path>
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
          </svg>
          <span class="btn-text">ĐỔI LÕI</span>
        </button>
      </div>
    </header>

    <div class="app-body">
      <!-- SIDEBAR TRÁI -->
      <aside class="sidebar mobile-visible" id="leftSidebar">
        <nav class="tabs" role="tablist">
          <button type="button" class="tab tab-active" role="tab" data-tab="biomnitrix">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg> BIOMNITRIX
          </button>
          <button type="button" class="tab" role="tab" data-tab="ultimatrix">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg> ULTIMATRIX
          </button>
          <button type="button" class="tab" role="tab" data-tab="chaquetrix">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.72-8.72 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> CHAQUETRIX
          </button>
        </nav>

        <section class="panel">
          <div class="panel-header">
            <h2 class="panel-title" id="panelTitle">
              <span class="panel-title-icon">✦</span>CHUỖI GEN ĐA HỢP
            </h2>
            <div class="panel-controls">
              <button type="button" class="icon-btn btn-dice" id="btnDice" title="Ngẫu nhiên hóa">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3" ry="3"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.5" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.5" fill="currentColor"/></svg>
              </button>
            </div>
          </div>
          <!-- Lưới ADN -->
          <div class="dna-grid" id="dnaGrid"></div>
          <!-- Các module UI tuỳ biến hiển thị ở đây -->
          <div class="subpanel-container" id="subpanelContainer"></div>
        </section>

        <!-- Nút Kích Hoạt -->
        <button type="button" class="process-btn" id="btnProcess">
          <svg id="btnProcessIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"></svg>
          <span id="btnProcessText">KHỞI ĐỘNG</span>
        </button>
      </aside>

      <!-- MAIN VIEW PHẢI -->
      <main class="main-view mobile-hidden" id="rightPanel">
        <div id="fusionResult" class="fusion-card" hidden></div>
        <div class="radar-wrap" id="radarWrap">
          <div class="radar-core" id="radarCore">
            <div class="radar-core-glow"></div>
            <div class="radar-core-base"></div>
            <div class="radar-core-icon" id="radarCoreIcon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"></svg>
            </div>
            <!-- Hiển thị Trạng thái Khởi động -->
            <div class="radar-core-status" id="radarCoreStatus">CHỜ KHỞI ĐỘNG</div>
          </div>
        </div>
      </main>
    </div>

    <!-- MODAL AUTH / SETTINGS (TÍNH NĂNG ĐĂNG NHẬP GOOGLE) -->
    <div id="settingsModal" class="modal-overlay" hidden>
      <div class="modal-container" style="width: min(100%, 400px);">
        <header class="modal-header">
          <h3>CÀI ĐẶT HỆ THỐNG</h3>
          <button type="button" class="modal-close-btn" id="btnSettingsClose">&times;</button>
        </header>
        <div style="padding: 20px; display: flex; flex-direction: column; gap: 15px;">
          <button id="btnGoogleLogin" class="google-login-btn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44-3.95 0-7.14-3.19-7.14-7.14s3.19-7.14 7.14-7.14c1.8 0 3.32.61 4.54 1.74l2.15-2.15C17.13 2.95 14.86 2 12.18 2 6.56 2 2 6.56 2 12.18s4.56 10.18 10.18 10.18c5.44 0 9.82-3.81 9.82-10 0-.82-.08-1.5-.23-2.26z"/></svg>
            Đăng nhập bằng Google
          </button>
          <div id="playerProfileInfo" hidden style="text-align: center; color: var(--theme-base);">
            ✓ Đã kết nối định danh
          </div>
        </div>
      </div>
    </div>

    <div id="playerNameModal" class="modal-overlay" hidden>
      <div class="modal-container" style="width: min(100%, 350px);">
        <header class="modal-header">
          <h3>XÁC NHẬN ĐỊNH DANH</h3>
        </header>
        <div style="padding: 20px; display: flex; flex-direction: column; gap: 15px;">
          <input type="text" id="playerNameInput" placeholder="Nhập tên nhân vật (Ví dụ: Ben)..." style="padding: 12px; border-radius: 8px; background: var(--panel-light); border: 1px solid var(--border); color: #fff; width: 100%; outline: none;" />
          <button id="btnConfirmName" class="process-btn" style="padding: 10px;">XÁC NHẬN</button>
        </div>
      </div>
    </div>

    <!-- MODAL CHỌN ALIEN -->
    <div id="modalOverlay" class="modal-overlay" hidden>
      <div class="modal-container">
        <header class="modal-header">
          <h3 id="modalTitle">NẠP MÃ GEN ALIEN</h3>
          <button type="button" class="modal-close-btn" id="btnModalClose">&times;</button>
        </header>
        <div class="modal-grid" id="modalGrid"></div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>
  </div>
  <script src="./script.js"></script>
</body>
</html>
