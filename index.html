<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LÕI OMNITRIX - BIOMNITRIX</title>
    
    <!-- Liên kết file CSS -->
    <link rel="stylesheet" href="./style.css">
    
    <!-- Thư viện Chart.js để vẽ biểu đồ Radar -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header class="app-header">
        <div class="logo">
            <span class="gemini-icon">✦</span>
            <div>
                <h1>LÕI OMNITRIX</h1>
                <p>USER_ID // TENNYSON</p>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-outline">ĐẤU TRƯỜNG</button>
            <button class="btn-outline">BỘ SƯU TẬP</button>
            <div class="to3-badge">TỔ 3</div>
        </div>
    </header>

    <main class="dashboard">
        
        <!-- CỘT TRÁI: ĐIỀU KHIỂN & CHỌN GEN -->
        <aside class="sidebar">
            <!-- Tabs mô phỏng -->
            <div class="mode-tabs">
                <button class="tab">ULTIMATE</button>
                <button class="tab active">BIOMNITRIX</button>
                <button class="tab">CHAQUETRIX</button>
            </div>

            <!-- Khu vực thiết lập gen -->
            <section class="panel dna-setup">
                <div class="panel-header">
                    <h2>CHUỖI GEN ĐA HỢP</h2>
                </div>
                
                <!-- Slots (Thay vì 3, giao diện mới ưu tiên 2 slot to) -->
                <div class="chamber" id="fusion-slots">
                    <!-- JS sẽ render ADN 1 và ADN 2 vào đây -->
                </div>

                <button id="fuse-btn" class="fuse-btn" disabled>
                    <span class="spinner"></span> ĐANG XỬ LÝ...
                </button>
            </section>

            <!-- Kho lưu trữ (Đưa xuống dưới, dạng cuộn ngang/dọc gọn gàng) -->
            <section class="panel inventory">
                <h2>KHO LƯU TRỮ ALIEN</h2>
                <div id="alien-grid" class="grid-container">
                    <!-- JS render danh sách Alien -->
                </div>
            </section>
        </aside>

        <!-- CỘT PHẢI: HIỂN THỊ KẾT QUẢ & THÔNG SỐ -->
        <section class="main-display">
            <div class="display-core" id="display-core">
                <!-- Vòng tròn tâm điểm khi chưa có kết quả -->
                <div class="core-placeholder" id="result-empty-state">
                    <div class="glow-ring">
                        <span class="core-icon">🧬</span>
                    </div>
                </div>

                <!-- Khu vực hiển thị kết quả thật -->
                <div id="result-content" class="hidden result-card">
                    <div class="result-header">
                        <h2 id="result-name">Tên Alien</h2>
                        <div class="rank-badge" id="fusion-rank">
                            Hạng: <span id="rank-value">SS</span>
                        </div>
                    </div>

                    <div class="result-body">
                        <!-- Cột ảnh -->
                        <div class="result-visual">
                            <div id="result-image-box" class="image-box">
                                <!-- Chứa ảnh dung hợp (icon/AI) -->
                            </div>
                            <div class="mutation-badge" id="result-mutation-badge">Bình thường</div>
                        </div>

                        <!-- Cột thông số -->
                        <div class="result-stats">
                            <div class="info-list">
                                <p><strong>Hệ:</strong> <span id="result-types"></span></p>
                                <p><strong>Nguy hiểm:</strong> <span id="result-danger-level"></span></p>
                                <p id="result-parents" class="text-muted"></p>
                            </div>
                            
                            <div class="chart-container">
                                <canvas id="result-radar-canvas"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script type="module" src="./main.js"></script>
</body>
</html>
