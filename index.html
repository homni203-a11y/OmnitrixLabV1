<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lõi Omnitrix - Biomnitrix</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        
        <!-- CỘT TRÁI: BẢNG ĐIỀU KHIỂN (SIDEBAR) -->
        <aside class="sidebar">
            
            <header class="app-header">
                <div class="logo">
                    <img src="./cpu.png" alt="CPU Core" class="cpu-icon">
                    <div>
                        <h1>LÕI OMNITRIX</h1>
                        <p>USER_ID // TENNYSON</p>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="btn-outline">ĐẤU TRƯỜNG</button>
                    <button class="btn-outline">BỘ SƯU TẬP</button>
                </div>
            </header>

            <!-- TABS MODULE -->
            <div class="mode-tabs">
                <button class="tab">
                    <span class="tab-icon">⚡</span> ULTIMATE
                </button>
                <button class="tab active">
                    <span class="tab-icon">📚</span> BIOMNITRIX
                </button>
                <button class="tab">
                    <span class="tab-icon">♡</span> CHAQUETRIX
                </button>
            </div>

            <div class="panel">
                <header class="panel__header">
                    <div class="title-group">
                        <span class="icon-stars">✦</span>
                        <h2 class="sidebar__title">CHUỖI GEN ĐA HỢP</h2>
                    </div>
                    <div class="sidebar__controls">
                        <!-- Nút Random -->
                        <button class="btn-icon" id="btn-random" title="Chọn ngẫu nhiên">⚁</button>
                        <!-- Điều chỉnh số lượng (2-5) -->
                        <div class="counter">
                            <button class="counter-btn" id="btn-decrease">−</button>
                            <span id="slot-count-display" class="counter-value">2</span>
                            <button class="counter-btn" id="btn-increase">+</button>
                        </div>
                    </div>
                </header>

                <!-- KHU VỰC CHỨA CÁC THẺ ADN -->
                <section class="dna-grid" id="fusion-slots">
                    <!-- JS sẽ render thẻ tại đây -->
                </section>
            </div>

            <!-- Kho chọn Alien -->
            <div class="panel inventory-panel">
                <h3 class="panel__title-small">KHO LƯU TRỮ ALIEN</h3>
                <div id="alien-grid" class="inventory-grid">
                    <!-- JS sẽ render kho tại đây -->
                </div>
            </div>

            <button class="btn-process" id="fuse-btn">
                <span class="spinner" id="fuse-spinner" style="display:none;"></span> 
                <span id="fuse-text">BẮT ĐẦU DUNG HỢP</span>
            </button>
        </aside>

        <!-- CỘT PHẢI: MÀN HÌNH HIỂN THỊ CHÍNH -->
        <main class="main-display">
            <div class="radar-background">
                <div class="radar-circle circle-1"></div>
                <div class="radar-circle circle-2"></div>
                <div class="radar-crosshair"></div>
            </div>

            <!-- UI Trống ban đầu -->
            <div id="empty-state" class="empty-state">
                <div class="dna-spinner">🧬</div>
                <p>ĐANG CHỜ MÃ GEN...</p>
            </div>

            <!-- Kết quả dung hợp -->
            <div class="display-content hidden" id="result-content">
                <section class="info-panel">
                    <header class="info-panel__header">
                        <div class="header-title">
                            <span class="icon-pulse">∿</span> BÁO CÁO MÃ GEN
                        </div>
                    </header>
                    
                    <div class="info-panel__id">[ MÃ ĐỊNH DANH GEN: <span id="res-id">UNKNOWN</span> ]</div>
                    <h1 class="alien-name-glowing" id="res-name">TÊN ALIEN</h1>

                    <div class="stats-grid">
                        <div class="stat-box">
                            <span class="stat-label">CẤP ĐỘ ĐE DỌA</span>
                            <div class="stat-value text-danger" id="res-danger">NGUY HIỂM</div>
                        </div>
                        <div class="stat-box">
                            <span class="stat-label">HỆ GEN GỐC</span>
                            <div class="stat-value text-green" id="res-type" style="font-size: 1rem;">-</div>
                        </div>
                        <div class="stat-box radar-box">
                            <span class="stat-label">∿ MA TRẬN CHỈ SỐ</span>
                            <div class="chart-container">
                                <canvas id="radar-chart"></canvas>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="alien-stage">
                    <div class="white-canvas">
                        <img id="res-image" src="" alt="Fusion Result" class="alien-img-placeholder">
                    </div>
                </section>
            </div>
        </main>
    </div>
    
    <!-- Link file JS (Cần set type="module" nếu bạn dùng import/export trong file data.js) -->
    <script type="module" src="./main.js"></script>
</body>
</html>
